version: "1.0.0"

# KALLAX 主配置文件
# Knowledge-Augmented Leveraged Learning Agent eXecutor

# ============================================================
# 运行模式
# ============================================================
mode: "claude_code"              # claude_code | copilot | gemini | codex
profile: "standard"              # lightweight | standard | enterprise

# ============================================================
# Conductor 白名单（可执行 conductor-override 操作）
# ============================================================
conductor_emails:
  - admin@example.com

# ============================================================
# 三仓库配置
# ============================================================
repositories:
  confluence: "./confluence"     # 知识库
  jira: "./jira"                 # 任务管理
  code: "./"                     # 代码仓库

# ============================================================
# 降级策略配置 (KALLAX 改进: 显式标注)
# ============================================================
degradation:
  mode: auto                     # auto | rust | node | shell
  redis_timeout: 5000            # Redis 超时阈值 (ms)
  node_crash_fallback: true      # Node.js 崩溃时降级到 Rust
  log_on_degradation: true       # 降级时必须记录日志
  emit_metrics: true             # 降级时必须发送指标

# ============================================================
# 并行隔离策略
# ============================================================
isolation:
  enforce_worktree: true         # 强制 worktree 隔离
  file_scope_check: true         # 文件范围检查
  max_parallel_performers: 5     # 最大并行 Performer 数
  scope_overlap_action: reject   # reject | warn | allow

# ============================================================
# 资源管理
# ============================================================
resources:
  cache:
    default_ttl: 300000          # 5 分钟 TTL (必须配置)
    max_entries: 1000            # LRU 最大条目

  connection_pool:
    max: 10                      # 最大连接数
    min: 2                       # 最小连接数
    acquire_timeout: 30000       # 获取超时 (ms)
    idle_timeout: 30000          # 空闲超时 (ms)

  circuit_breaker:
    failure_threshold: 3         # 失败阈值
    reset_timeout: 30000         # 重置超时 (ms)
    exponential_backoff: true    # 指数退避

# ============================================================
# 错误处理策略 (KALLAX 改进: 禁用 panic/expect)
# ============================================================
error_handling:
  # CI 自动检测违规
  scan_on_commit: true
  forbidden_patterns:
    rust:
      - ".expect("
      - ".unwrap()"
      - "panic!"
    typescript:
      - ": any"
      - "@ts-ignore"
      - "@ts-expect-error"
      - "catch (e) {}"

  # 错误脱敏
  sanitize:
    patterns:
      - "(?i)(password|secret|token|api_key)=[^&\\s]+"
      - "Bearer [a-zA-Z0-9._-]+"
      - "ghp_[a-zA-Z0-9]+"

# ============================================================
# 验证策略
# ============================================================
verification:
  # Conductor 验证 Performer 产出
  conductor_verify_output: true
  verification_steps:
    - command: "ls -la"
      description: "检查文件存在"
    - command: "git show --stat"
      description: "检查实际修改"
    - command: "npm test"
      description: "运行真实测试"

  # 4-Level Fact-Forcing
  fact_forcing:
    level_1_existence: true      # 文件存在检查
    level_2_substance: true      # 实质内容检查
    level_3_wiring: true         # 接线正确检查
    level_4_dataflow: true       # 数据流检查

# ============================================================
# 日志配置
# ============================================================
logging:
  level: info                    # debug | info | warn | error
  format: json                   # json | pretty
  output: "./logs"
  rotation:
    max_size: "10MB"
    max_files: 10

# ============================================================
# 监控配置
# ============================================================
monitoring:
  memory:
    warning_threshold: 0.75      # 75% 内存警告
    critical_threshold: 0.90     # 90% 内存危险

  context:
    max_tokens: 100000           # 最大 token 数
    compress_threshold: 0.75     # 压缩触发阈值
    preserve_recent: 50          # 保留最近 N 条

# ============================================================
# HTTP API 配置
# ============================================================
server:
  port: 9877
  host: "127.0.0.1"
  cors:
    enabled: true
    origins: ["http://localhost:3000"]

# ============================================================
# Web Dashboard 配置
# ============================================================
dashboard:
  port: 3000
  host: "127.0.0.1"
  auto_open: false

# ============================================================
# 引用模块化配置
