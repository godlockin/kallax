name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - miao
      - main
      - testing
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Node install build
        run: |
          cd node
          npm ci
          npm run build
          ls -la dist/

      - name: Rust setup
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Rust build
        env:
          RUSTFLAGS: "-C link-arg=-s"
        run: |
          set +e
          cd rust
          cargo build --release --target ${{ matrix.rust_target }} 2>&1 | tail -20
        shell: bash

      - name: Archive
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
        run: |
          mkdir -p out
          tar -czf out/kallax-cli-rule-${TAG}-${PLATFORM}.tar.gz -C node/dist .
          ls -lh out/
        shell: bash

      - name: Upload (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: out/kallax-cli-rule-${{ github.ref_name }}-${{ matrix.name }}.tar.gz

      - name: Verify (branch only)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          echo "Verify build complete on ${{ github.ref }}"
          ls -lh out/
