name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - miao
      - main
      - testing
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Node install build
        run: |
          cd node
          npm ci
          npm run build
          ls -la dist/

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust build
        env:
          RUSTFLAGS: "-C link-arg=-s"
        run: |
          set +e
          cd rust
          cargo build --release --target ${{ matrix.rust_target }} 2>&1 | tail -20
        shell: bash

      - name: Archive
        env:
          TAG: ${{ github.ref_name }}
          PLATFORM: ${{ matrix.name }}
        run: |
          mkdir -p out
          tar -czf out/kallax-cli-rule-${TAG}-${PLATFORM}.tar.gz -C node/dist .
          ls -lh out/
        shell: bash

      - name: Upload (tag only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/kallax-cli-rule-${{ github.ref_name }}-${{ matrix.name }}.tar.gz

      - name: Verify (branch only)
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          echo "Verify build complete on ${{ github.ref }}"
          ls -lh out/
