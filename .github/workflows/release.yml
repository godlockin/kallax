name: Release

on:
  push:
    # Full release: tag push v* triggers upload
    tags:
      - 'v*'
    # Verify-only: branch push triggers build but skips publish (EPIC-130 主公触发)
    branches:
      - miao
      - main
      - testing
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish release assets to GitHub Release'
        required: false
        type: boolean
        default: false

# Cancel in-progress runs when new push arrives (saves CI minutes)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Matrix build: 5 platforms, only upload on tag push
  # ===========================================================================
  release:
    name: Build ${{ matrix.name }}${{ (startsWith(github.ref, 'refs/tags') || inputs.publish) && ' + ship' || ' (verify)' }}
    strategy:
      # don't cancel others on first failure — collect all assets then publish
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - name: darwin-x64
            os: macos-13
            rust_target: x86_64-apple-darwin
            archive_ext: tar.gz
          - name: darwin-arm64
            os: macos-14
            rust_target: aarch64-apple-darwin
            archive_ext: tar.gz
          - name: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            archive_ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── Node CLI: same across platforms (tsc output is portable JS) ──
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: node/package-lock.json
      - name: Node install + build
        run: |
          cd node
          npm ci
          npm run build
          ls -la dist/

      # ── Rust engine: per-platform binary ──────────────────────────────
      - name: Rust setup toolchain (${{ matrix.rust_target }})
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Windows binary suffix
        if: runner.os == 'Windows'
        run: echo "BIN_EXT=.exe" >> $GITHUB_ENV
        shell: bash
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Rust build static binary
        env:
          RUSTFLAGS: "-C link-arg=-s"
        run: |
          set +e
          cd rust
          BUILD_LOG=/tmp/cargo-build.log
          TARGET="${{ matrix.rust_target }}"
          mkdir -p ../dist-rust
          if cargo build --release --target "$TARGET" > "$BUILD_LOG" 2>&1; then
            echo "cargo build --release OK for $TARGET"
            cp "target/$TARGET/release/kallax${BIN_EXT:-}" ../dist-rust/kallax-engine
          elif cargo build --target "$TARGET" > "$BUILD_LOG" 2>&1; then
            echo "::warning::fallback to debug build for $TARGET"
            cp "target/$TARGET/debug/kallax${BIN_EXT:-}" ../dist-rust/kallax-engine
          else
            echo "::warning::Rust build failed for $TARGET; Node-only release"
            tail -30 "$BUILD_LOG" || true
          fi
          if [ -f ../dist-rust/kallax-engine ]; then
            chmod +x ../dist-rust/kallax-engine 2>/dev/null || true
            ls -lh ../dist-rust/kallax-engine
            file ../dist-rust/kallax-engine 2>/dev/null || true
          fi
        shell: bash

      # ── Archive per-platform ───────────────────────────────────────────
      - name: Archive package release (${{ matrix.name }})
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUNNER: ${{ runner.os }}
          PLATFORM: ${{ matrix.name }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -e
          ARCHIVE_NAME="kallax-cli-rule-${TAG}-${PLATFORM}.${ARCHIVE_EXT}"
          STAGE_DIR="release-stage-${PLATFORM}"
          rm -rf "$STAGE_DIR" dist-rust
          mkdir -p "$STAGE_DIR"

          # Node dist (cross-platform JS)
          mkdir -p "$STAGE_DIR/node/dist"
          if [ -d "node/dist" ]; then
            cp -r node/dist/. "$STAGE_DIR/node/dist/"
            cp node/package.json "$STAGE_DIR/node/"
          fi

          # Rust engine
          if [ -f dist-rust/kallax-engine ]; then
            mkdir -p "$STAGE_DIR/rust"
            cp dist-rust/kallax-engine "$STAGE_DIR/rust/"
            chmod +x "$STAGE_DIR/rust/kallax-engine" 2>/dev/null || true
          fi

          # Install scripts
          mkdir -p "$STAGE_DIR/scripts"
          for f in setup.sh cli-rule init-project.sh; do
            if [ -f "scripts/$f" ]; then cp "scripts/$f" "$STAGE_DIR/scripts/"; fi
          done

          # Hooks
          mkdir -p "$STAGE_DIR/hooks"
          for f in exec-task.sh bash-rule-enforcer.sh verify-rule.sh; do
            if [ -f "hooks/$f" ]; then cp "hooks/$f" "$STAGE_DIR/hooks/"; fi
          done

          # Manifest
          {
            echo "tag=${TAG}"
            echo "commit=${SHA}"
            echo "platform=${PLATFORM}"
            echo "runner_os=${RUNNER}"
            echo "rust_target=${{ matrix.rust_target }}"
            echo "built_at=$(date -u +%FT%TZ)"
          } > "$STAGE_DIR/MANIFEST"

          # Tar (or zip on windows)
          case "$ARCHIVE_EXT" in
            tar.gz)
              tar -czf "$ARCHIVE_NAME" -C "$STAGE_DIR" .
              ;;
            zip)
              # Windows zip — powershell Compress-Archive prefers relative paths
              cd "$STAGE_DIR"
              powershell Compress-Archive -Path './*' -DestinationPath "../${ARCHIVE_NAME}" -Force
              cd ..
              ;;
          esac

          ls -lh "$ARCHIVE_NAME"
          if [ "$ARCHIVE_EXT" = "tar.gz" ]; then
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
            cat "${ARCHIVE_NAME}.sha256"
          fi
        shell: bash

      # ── Upload per-platform assets — only on tag push or manual publish ──
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            kallax-cli-rule-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.archive_ext }}
            kallax-cli-rule-${{ github.ref_name }}-${{ matrix.name }}.${{ matrix.archive_ext }}.sha256

      # ── Verify-only fallback: just print archive (no upload) ──────────
      - name: Verify build (no publish)
        if: "!startsWith(github.ref, 'refs/tags/') && !(github.event_name == 'workflow_dispatch' && inputs.publish == true)"
        run: |
          ARCHIVE_NAME="kallax-cli-rule-${GITHUB_REF_NAME}-${{ matrix.name }}.${{ matrix.archive_ext }}"
          echo "=== Verify-only build (no upload) ==="
          echo "Archive would be: ${ARCHIVE_NAME}"
          if [ -f "${ARCHIVE_NAME}" ]; then
            echo "✅ archive exists locally"
            ls -lh "${ARCHIVE_NAME}"
          else
            echo "❌ archive missing — build failed"
            exit 1
          fi
