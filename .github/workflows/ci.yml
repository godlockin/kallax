name: KALLAX CI/CD

on:
  push:
    branches: [main, testing, miao, develop]
  pull_request:
    # EPIC-231: 补 testing + miao — 原先只有 [main, develop],
    # 导致 main→miao 和 feature→testing 的 PR 完全不跑 CI
    branches: [main, testing, miao, develop]

env:
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  # ============================================================
  # Hook Health (EPIC-224 — 防 core.hooksPath 再次失效)
  # ============================================================
  hook-health:
    name: Hook Health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify hook scripts are executable
        run: |
          set -e
          for h in pre-commit pre-push commit-msg; do
            if [ ! -f "scripts/hooks/$h" ]; then
              echo "FAIL: scripts/hooks/$h missing"
              exit 1
            fi
            if [ ! -x "scripts/hooks/$h" ]; then
              echo "FAIL: scripts/hooks/$h not executable"
              exit 1
            fi
            echo "OK: scripts/hooks/$h present + executable"
          done

      - name: Verify hook scripts pass shellcheck syntax
        run: |
          set -e
          for h in pre-commit pre-push commit-msg install.sh; do
            bash -n "scripts/hooks/$h"
            echo "OK: scripts/hooks/$h syntax valid"
          done

      - name: Verify installer detects broken hooksPath
        run: |
          set -e
          git config core.hooksPath /nonexistent/path/for/ci-test
          if bash scripts/hooks/install.sh --verify; then
            echo "FAIL: --verify should exit 1 on broken hooksPath"
            git config --unset core.hooksPath || true
            exit 1
          fi
          echo "OK: --verify correctly detected broken hooksPath"
          git config --unset core.hooksPath || true

      - name: Verify installer repairs and passes
        run: |
          set -e
          bash scripts/hooks/install.sh
          bash scripts/hooks/install.sh --verify
          echo "OK: installer repaired + verify passes"

      - name: Verify EPIC-219/220/223 gates wired into pre-commit
        run: |
          set -e
          for gate in check-disclaimer snapshot-claude-md check-ticket-schema; do
            if ! grep -q "$gate" scripts/hooks/pre-commit; then
              echo "FAIL: $gate not wired into pre-commit"
              exit 1
            fi
            echo "OK: $gate wired into pre-commit"
          done

      - name: Verify hooks are set -u safe (EPIC-224 真 bug 回归)
        run: |
          set -e
          # 真 bug: pre-push 引用未定义的 GIT_PUSH_OPTION_COUNT → set -u abort → push 静默失败
          if ! grep -q 'GIT_PUSH_OPTION_COUNT:-' scripts/hooks/pre-push; then
            echo "FAIL: pre-push GIT_PUSH_OPTION_COUNT 缺 :- 默认值"
            exit 1
          fi
          echo "OK: pre-push GIT_PUSH_OPTION_COUNT 有默认值"
          # 真跑 pre-push (无 GIT_PUSH_OPTION_* 环境), 不应报 unbound variable
          out="$(bash scripts/hooks/pre-push origin https://example.com/repo.git 2>&1 </dev/null || true)"
          if echo "$out" | grep -q 'unbound variable'; then
            echo "FAIL: pre-push 报 unbound variable"
            echo "$out" | head -5
            exit 1
          fi
          echo "OK: pre-push 无 unbound variable"

      - name: Verify 4-branch flow 完整 (EPIC-229 防 testing 误删)
        run: |
          set -e
          # 起因 (EPIC-217 事故): gh pr merge --delete-branch 删掉 testing,
          # 导致 EPIC-218~222 跳过 testing 阶段直接 feature→main
          if [ ! -x scripts/verify/check-branch-flow.sh ]; then
            echo "FAIL: scripts/verify/check-branch-flow.sh missing or not executable"
            exit 1
          fi
          bash -n scripts/verify/check-branch-flow.sh
          echo "OK: check-branch-flow.sh syntax valid"
          # CI 环境有 origin remote, 实跑验证
          if bash scripts/verify/check-branch-flow.sh --verify; then
            echo "OK: 4-branch flow 完整"
          else
            echo "FAIL: 4-branch flow 缺失 branch"
            exit 1
          fi

  # ============================================================
  # PR Flow Gate (EPIC-231 — 防反向 PR + 空 PR)
  #
  # 起因: PR #316 (miao→testing, 0 files) + #317 (testing→main, 0 files)
  #       空 commit 顶 "EPIC-217 elevator" 标题进 main.
  #       实测 EPIC-217 README 改动从未进过 main/miao:
  #         git show origin/main:README.md | grep -c "When to use"  → 0
  #       回溯审计 25 个已合 PR: 15 违规 (13 跳 testing + 2 squash 断链).
  #
  # 安全: PR 编号走 env (整数), 不内联 ${{ }} 到 run: 防注入.
  # ============================================================
  pr-flow-gate:
    name: PR Flow Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: 校验 PR 方向 + 非空 (EPIC-231)
        env:
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # PR_NUMBER 是整数, 但仍显式校验 (defense in depth)
          case "$PR_NUMBER" in
            ''|*[!0-9]*)
              echo "FAIL: PR_NUMBER 非法: '$PR_NUMBER'"
              exit 1
              ;;
          esac
          rc=0
          bash scripts/verify/check-branch-flow.sh --pr "$PR_NUMBER" || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "FAIL: gh 不可用 — 本 gate 不接受 BLOCKED-env 静默通过"
            exit 1
          fi
          exit "$rc"

      - name: 负向测试 — 已知违规 PR 必须被拦 (meta-check)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 拿 PR #316 (miao→testing, 0 files) 当固定负样本.
          # 若 gate 对它返回 0, 说明检测逻辑坏了 (跟 EPIC-224 hook meta-check 同理).
          rc=0
          bash scripts/verify/check-branch-flow.sh --pr 316 > /tmp/neg.log 2>&1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "FAIL: gate 未拦住已知违规 PR #316 — 检测逻辑失效"
            cat /tmp/neg.log
            exit 1
          fi
          if [ "$rc" -eq 2 ]; then
            echo "FAIL: gh 不可用, 负向测试无法执行"
            exit 1
          fi
          if ! grep -q "方向非法" /tmp/neg.log; then
            echo "FAIL: 拦住了但原因不对 (缺 '方向非法')"
            cat /tmp/neg.log
            exit 1
          fi
          if ! grep -q "空 PR" /tmp/neg.log; then
            echo "FAIL: 拦住了但漏检空 PR"
            cat /tmp/neg.log
            exit 1
          fi
          echo "OK: 负样本 PR #316 被正确拦截 (方向 + 空 PR 双命中)"

  # ============================================================
  # Node.js Checks
  # ============================================================
  node-lint:
    name: Node.js Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  node-typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: cd node && npm run typecheck

  node-test:
    name: Node.js Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  node-build:
    name: Node.js Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ============================================================
  # Rust Checks
  # ============================================================
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Run tests
        run: cargo test --all-features

  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Build release
        run: cargo build --release

  # ============================================================
  # Code Quality Gates
  # ============================================================
  forbidden-patterns:
    name: Forbidden Patterns Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check for 'any' type in TypeScript
        run: |
          echo "Checking for 'any' type..."
          # EPIC-158: regex 排除 JSDoc prose 'fail-closed: any error' 等
          # grep 输出格式 `path:N: content`, JSDoc 行 format `path:N: * ...`
          # 排除规则: 行首(在 grep 输出格式 `:` 前)以空格+`*` 或空格+`//` 开头, OR 内容以 `* ` 或 `// ` 开头(JSDoc prose)
          if grep -rn ': any' --include="*.ts" --include="*.tsx" node/ 2>/dev/null \
            | grep -v 'node_modules' \
            | grep -v '.d.ts' \
            | grep -v -E '^[^:]+:[0-9]+:\s*\*' \
            | grep -v -E '^[^:]+:[0-9]+:\s*//'; then
            echo "::error::Found 'any' type usage. Please use proper types."
            exit 1
          fi
          echo "No 'any' types found."

      - name: Check for @ts-ignore
        run: |
          echo "Checking for @ts-ignore..."
          # EPIC-211: 排除注释行 (跟 EPIC-158 regex false-positive 1:1)
          if grep -rn "@ts-ignore" --include="*.ts" --include="*.tsx" node/ 2>/dev/null \
            | grep -v "node_modules" \
            | grep -v -E '^[^:]+:[0-9]+:\s*\*' \
            | grep -v -E '^[^:]+:[0-9]+:\s*//'; then
            echo "::error::Found @ts-ignore. Please fix the type error."
            exit 1
          fi
          echo "No @ts-ignore found."

      - name: Check for @ts-expect-error
        run: |
          echo "Checking for @ts-expect-error..."
          # EPIC-211: 排除注释行 (跟 EPIC-158 1:1)
          if grep -rn "@ts-expect-error" --include="*.ts" --include="*.tsx" node/ 2>/dev/null \
            | grep -v "node_modules" \
            | grep -v -E '^[^:]+:[0-9]+:\s*\*' \
            | grep -v -E '^[^:]+:[0-9]+:\s*//'; then
            echo "::error::Found @ts-expect-error. Please fix the type error."
            exit 1
          fi
          echo "No @ts-expect-error found."

      - name: Check for Rust expect()
        run: |
          echo "Checking for .expect() in Rust..."
          if grep -rn "\.expect(" --include="*.rs" rust/ 2>/dev/null | grep -v "test" | grep -v "#\[cfg(test)\]"; then
            echo "::warning::Found .expect() usage. Consider using ? operator instead."
          fi

      - name: Check for Rust unwrap()
        run: |
          echo "Checking for .unwrap() in Rust..."
          if grep -rn "\.unwrap()" --include="*.rs" rust/ 2>/dev/null | grep -v "test" | grep -v "#\[cfg(test)\]"; then
            echo "::warning::Found .unwrap() usage. Consider using ? operator instead."
          fi

      - name: Check for panic! in Rust
        run: |
          echo "Checking for panic! in Rust..."
          if grep -rn "panic!" --include="*.rs" rust/ 2>/dev/null | grep -v "test" | grep -v "#\[cfg(test)\]"; then
            echo "::warning::Found panic! usage. Consider proper error handling."
          fi

      - name: Check for console.log
        run: |
          echo "Checking for console.log..."
          if grep -rn "console\.log" --include="*.ts" --include="*.tsx" node/ 2>/dev/null | grep -v "node_modules" | grep -v "\.test\."; then
            echo "::warning::Found console.log. Consider using structured logging."
          fi

  # ============================================================
  # Security
  # ============================================================
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: Check for secrets
        run: |
          echo "Checking for potential secrets..."
          # Fail closed: any tracked source/config match blocks CI for review.
          if git grep -n -I -E '(password|secret|api[_-]?key|token)[[:space:]]*=[[:space:]]*["'"'][^"'"']+["'"']' -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' ':!*.example*'; then
            echo "::error::Potential secret found in tracked source. Remove it or use environment configuration."
            exit 1
          fi
          echo "No potential secrets found."

  # ============================================================
  # Integration
  # ============================================================
  all-checks:
    name: All Checks Passed
    needs:
      - hook-health
      - node-lint
      - node-typecheck
      - node-test
      - node-build
      - rust-lint
      - rust-test
      - rust-build
      - forbidden-patterns
      - security-audit
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: echo "All CI checks passed successfully!"
