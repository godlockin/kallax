name: PR Body Check
on:
  pull_request:
    types: [opened, edited, synchronize]
jobs:
  check-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write PR body to file
        run: echo "$BODY" > /tmp/pr-body.txt
        env:
          BODY: ${{ github.event.pull_request.body }}
      - name: Validate PR body
        run: |
          BODY=$(cat /tmp/pr-body.txt)
          issues=""
          if ! echo "$BODY" | grep -qiE '(test|PASS|pass|✓|coverage)'; then
            issues="$issues\n- Missing test evidence"
          fi
          if ! echo "$BODY" | grep -qiE '(TASK|TICKET|task|ticket)-\d+'; then
            issues="$issues\n- Missing ticket reference"
          fi
          BODY_LENGTH=$(echo "$BODY" | wc -c)
          if [ "$BODY_LENGTH" -lt 50 ]; then
            issues="$issues\n- PR body too short (<50 chars)"
          fi
          if [ -n "$issues" ]; then
            echo "::error::PR body validation failed:$issues"
            exit 1
          fi
          echo "PR body validation passed"
