name: Performance Baseline

on:
  push:
    branches: [main]
    paths:
      - 'node/**'
      - 'rust/**'
      - 'package.json'
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (measure only, no baseline update)'
        required: false
        default: 'false'

env:
  NODE_VERSION: '20'
  RUST_VERSION: 'stable'

jobs:
  build-baseline:
    name: Build Time Baseline
    runs-on: ubuntu-latest
    outputs:
      node_build_ms: ${{ steps.node-timing.outputs.node_build_ms }}
      rust_build_ms: ${{ steps.rust-timing.outputs.rust_build_ms }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Measure Node.js build time
        id: node-timing
        run: |
          START=$(date +%s%N)
          npm run build 2>&1
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "node_build_ms=${DURATION_MS}" >> "$GITHUB_OUTPUT"
          echo "Node.js build: ${DURATION_MS}ms"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Measure Rust build time
        id: rust-timing
        working-directory: ./rust
        run: |
          START=$(date +%s%N)
          cargo build --release 2>&1
          END=$(date +%s%N)
          DURATION_MS=$(( (END - START) / 1000000 ))
          echo "rust_build_ms=${DURATION_MS}" >> "$GITHUB_OUTPUT"
          echo "Rust build: ${DURATION_MS}ms"

  baseline-report:
    name: Baseline Report
    needs: build-baseline
    runs-on: ubuntu-latest
    steps:
      - name: Print baseline results
        env:
          NODE_MS: ${{ needs.build-baseline.outputs.node_build_ms }}
          RUST_MS: ${{ needs.build-baseline.outputs.rust_build_ms }}
        run: |
          echo "## Performance Baseline Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Build | ${{ env.NODE_MS }} ms |" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Build | ${{ env.RUST_MS }} ms |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Check for regressions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Baseline captured: Node=${{ needs.build-baseline.outputs.node_build_ms }}ms, Rust=${{ needs.build-baseline.outputs.rust_build_ms }}ms"
