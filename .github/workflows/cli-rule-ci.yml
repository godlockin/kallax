name: CLI Rule CI

on:
  push:
    branches: [main, develop, miao]
    paths:
      - 'scripts/cli-rule'
      - 'scripts/setup.sh'
      - 'hooks/**'
      - 'docs/cli-rule.md'
      - 'docs/cli-rule-lessons.md'
      - '.github/workflows/cli-rule-ci.yml'
  pull_request:
    branches: [main, develop, miao]
    paths:
      - 'scripts/cli-rule'
      - 'scripts/setup.sh'
      - 'hooks/**'
      - 'docs/cli-rule.md'
      - 'docs/cli-rule-lessons.md'

jobs:
  test:
    name: Test CLI Rule scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          set -e
          for f in scripts/cli-rule scripts/setup.sh hooks/*.sh; do
            echo "Checking syntax: $f"
            bash -n "$f"
          done

      - name: shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./scripts
          additional_files: 'hooks/*.sh'

      - name: Help works
        run: bash scripts/cli-rule help | head -20

      - name: Version works
        run: bash scripts/cli-rule --version

  release:
    name: Build CLI Rule artifacts
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Create artifact bundle
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          cp scripts/cli-rule dist/kallax-cli-rule
          cp scripts/setup.sh dist/kallax-setup.sh
          mkdir -p dist/hooks
          cp hooks/*.sh dist/hooks/
          mkdir -p dist/docs
          cp docs/cli-rule.md dist/docs/
          cp docs/cli-rule-lessons.md dist/docs/
          chmod +x dist/kallax-cli-rule dist/kallax-setup.sh dist/hooks/*.sh

      - name: Create archive
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          cd dist
          tar -czf "../kallax-cli-rule-${REF_NAME}.tar.gz" *
          cd ..
          shasum -a 256 "kallax-cli-rule-${REF_NAME}.tar.gz" > "kallax-cli-rule-${REF_NAME}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kallax-cli-rule
          path: |
            kallax-cli-rule-*.tar.gz
            kallax-cli-rule-*.tar.gz.sha256

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            kallax-cli-rule-*.tar.gz
            kallax-cli-rule-*.tar.gz.sha256