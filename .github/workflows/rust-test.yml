name: Rust Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'rust/**'
      - 'Cargo.lock'
  pull_request:
    branches: [main, develop]
    paths:
      - 'rust/**'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLORS: always

jobs:
  test:
    name: cargo test --all-features
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Run tests
        run: cargo test --all-features

  test-no-default:
    name: cargo test --no-default-features
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Run tests (no default features)
        run: cargo test --no-default-features

  doc-test:
    name: cargo test --doc
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Run doc tests
        run: cargo test --doc

  coverage:
    name: cargo tarpaulin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin 2>/dev/null || echo "::warning::tarpaulin install failed"

      - name: Generate coverage
        run: cargo tarpaulin --all-features --out xml --output-dir ./coverage 2>/dev/null || echo "::warning::tarpaulin run failed"

      - name: Upload coverage
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: ./rust/coverage
          fail_ci_if_error: false
