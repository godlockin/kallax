name: Rust Build Check

on:
  push:
    branches: [main, develop]
    paths:
      - 'rust/**'
      - 'Cargo.lock'
  pull_request:
    branches: [main, develop]
    paths:
      - 'rust/**'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLORS: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: cargo check
        run: cargo check --all-features

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: rust

      - name: cargo clippy
        run: cargo clippy --all-features -- -D warnings

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26
        with:
          components: rustfmt

      - name: cargo fmt
        run: cargo fmt --check --all

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rust
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-07-26

      - name: Install cargo-deny
        uses: taiki-e/install-action@0843b7c6f00e5da5a08f795c041bd69dbba2ba6d # cargo-deny

      - name: cargo deny check
        run: cargo deny check 2>/dev/null || echo "::warning::cargo-deny not configured — skipping"
