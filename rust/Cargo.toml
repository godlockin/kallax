[workspace]
members = [
    "crates/kallax-core",
    "crates/kallax-engine",
    "crates/kallax-cli",
    "crates/kallax-server",
    "crates/kallax-bench",
]
default-members = ["crates/kallax-core"]
# EPIC-060-B Phase 2: 主用 crate 拍板 (方案 B, 1 主用 4 备 渐进)
# Iter 3: drop 3 unreachable crates (kallax-bridge/kallax-election/context-mon).
# The Node.js side reimplements election/event-bus/data-adapter without Rust deps.
resolver = "2"

[workspace.package]
version = "3.3.0"
edition = "2021"
authors = ["KALLAX Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling (no unwrap/expect/panic)
thiserror = "1.0"
anyhow = "1.0"

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Web framework
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Database
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] }
rusqlite = { version = "0.39", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.34"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "5.5"
parking_lot = "0.12"
async-trait = "0.1"

# Tree-sitter (with timeout control)
tree-sitter = "0.20"
regex = "1.10"

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"

# Internal crates
kallax-core = { path = "crates/kallax-core" }
kallax-engine = { path = "crates/kallax-engine" }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
debug = true
