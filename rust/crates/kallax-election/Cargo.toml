[package]
name = "kallax-election"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "KALLAX multi-master election via Raft consensus (L1 Rust 主用 + L2 single-master 备, 跟 eket 4 级降级 模式 联合, 跟 Phase 1 ioredis + Phase 2 litestream 联合)"

[lib]
crate-type = ["rlib"]
name = "kallax_election"

[[bin]]
name = "kallax-election"
path = "src/bin/election-cli.rs"

[dependencies]
# Workspace shared deps (跟 v2.7.4 D4.4-D4.6 + D4.5 联合)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
anyhow = { workspace = true }

# SQLite-backed log persistence (跟 Phase 2 litestream 联合, WAL mode)
rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }

# Random timeout jitter (election timeout randomization 跟 Raft spec 联合)
rand = "0.8"

[dev-dependencies]
# 0 deps 必要 — 集成测试 在 tests/integration/ 跟 shell 联合
