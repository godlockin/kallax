[package]
name = "kallax-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Node.js ↔ Rust FFI bridge via napi-rs (EPIC-060-B Phase 3 scaffold)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `napi` feature gates the FFI exports. Disabled during `cargo test` so the
# rlib builds without linking against Node.js symbols (which only exist at
# runtime via `napi build` / `npm install` + dynamic loading).
# Default ON so `cargo build` and `napi build --platform` produce the cdylib.
default = ["napi"]
napi = ["dep:napi", "dep:napi-derive"]

[dependencies]
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
tracing.workspace = true
thiserror.workspace = true
kallax-core = { workspace = true }