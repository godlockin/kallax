[package]
name = "kallax-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "KALLAX napi-rs bridge for Node.js ↔ Rust master-verify (L1 Rust 主用 + L2 Node.js 备, 跟 eket 4 级降级 模式 联合). Event-bus + data-adapter orphan modules DEFERRED (跨 release 留待 拍板)"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# napi-bindings feature 默认 启用 (cdylib 路径); examples/ cargo run 用 --no-default-features
# 跑 纯 Rust logic (0 napi linkage, 0 node headers 必需, 跨 平台 跑).
default = ["napi-bindings"]
napi-bindings = ["dep:napi", "dep:napi-derive", "dep:napi-build"]

[dependencies]
# Workspace shared deps (跟 v2.7.4 D4.4-D4.6 + D4.5 联合)
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }

# Event bus bridge deps (EPIC-060-B 阶段 3 子任务 2 REBUILD, 跨 release 留待 → ACTIVE)
# 跟"诚实修正" 战略 联合: 9dcca01 orphan fix commit 删了 5 deps, 现在 REBUILD 5 deps 加回
# (chrono + parking_lot + tokio + uuid + tracing-subscriber)
chrono = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
tracing-subscriber = { workspace = true }

# napi-rs 2.16 (offline-cached, 跟 napi 2.16.17 + napi-derive 2.16.13 + napi-build 2.3.2 联合)
napi = { version = "2.16", default-features = false, features = ["serde-json", "napi4"], optional = true }
napi-derive = { version = "2.16", optional = true }

# DEFERRED orphan modules deps (data_adapter 跨 release 留待 拍板, 跟"独立" 战略 联合)
# r2d2 = { workspace = true }
# r2d2_sqlite = { workspace = true }
# rusqlite = { workspace = true }

[build-dependencies]
napi-build = { version = "2.3", optional = true }

[dev-dependencies]
# 0 deps 必要 — 集成测试 在 tests/integration/ 跟 shell 联合
